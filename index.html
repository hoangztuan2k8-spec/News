<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes bgFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            
            background-image: url('https://cdn.discordapp.com/attachments/1343886719145213993/1557372250838270032/349ab2ad88ef3977285bcdf3568ae624.jpg?backend=b2&ex=6ac78f6f&is=6ac63def&hm=1d09d5e06b049ca6b8a8171001410ecd8274344e4c8a6b3f4dea7e17a44773e4&');
            background-size: cover;          
            background-position: center center; 
            background-repeat: no-repeat;    
            background-attachment: fixed;    
            
            display: flex;
            justify-content: center;
            align-items: center;
            
            animation: bgFadeIn 1.2s ease-out forwards;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); 
            z-index: 1;
            transition: background 0.4s ease;
        }

        body.light-mode::before {
            background: rgba(255, 255, 255, 0.25);
        }

        @keyframes containerFadeIn {
            0% { transform: scale(0.85) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .container {
            width: 92%;
            max-width: 560px;
            max-height: 92vh;
            overflow-y: auto;
            background: rgba(20, 20, 25, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            padding: 20px;
            text-align: left;
            opacity: 0;
            animation: containerFadeIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
            transition: background 0.4s ease, border 0.4s ease;
        }

        body.light-mode .container {
            background: rgba(255, 255, 255, 0.38);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .container::-webkit-scrollbar { width: 4px; }
        .container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }

        .header-posts {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        body.light-mode .header-posts { border-bottom: 1px solid rgba(0, 0, 0, 0.1); }

        .header-title-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-posts h2 {
            margin: 0;
            font-size: 18px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        body.light-mode .header-posts h2 { color: #111; text-shadow: none; }

        .add-post-toggle-btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: #fff;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .add-post-toggle-btn.show { display: inline-flex; }
        .add-post-toggle-btn:hover { transform: scale(1.2) rotate(90deg); }

        .top-controls {
            display: flex;
            gap: 6px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            outline: none;
            color: #fff;
            text-decoration: none;
        }

        body.light-mode .control-btn {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: #222;
        }

        .control-btn:hover { transform: scale(1.15); }

        /* HỘP THOẠI MODAL NỔI */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: 90%;
            max-width: 440px;
            max-height: 85vh;
            overflow-y: auto;
            background: rgba(25, 25, 35, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            transform: scale(0.8) translateY(20px);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-sizing: border-box;
        }

        body.light-mode .modal-content {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 10px;
        }
        body.light-mode .modal-header { border-bottom: 1px solid rgba(0, 0, 0, 0.1); }

        .modal-header h3 {
            margin: 0;
            font-size: 16px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        body.light-mode .modal-header h3 { color: #111; }

        .modal-close-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        body.light-mode .modal-close-btn { background: rgba(0, 0, 0, 0.1); color: #333; }
        .modal-close-btn:hover { background: rgba(255, 0, 0, 0.4); color: #fff; }

        .modal-content input, .modal-content textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 10px 12px;
            color: #fff;
            font-size: 12.5px;
            margin-bottom: 10px;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
            transition: all 0.3s;
        }
        body.light-mode .modal-content input, body.light-mode .modal-content textarea {
            background: rgba(255, 255, 255, 0.6);
            color: #111;
            border-color: rgba(0, 0, 0, 0.15);
        }
        .modal-content input:focus, .modal-content textarea:focus {
            border-color: #2ecc71;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
        }
        .modal-content textarea { resize: vertical; min-height: 80px; }

        .post-submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: #fff;
            border: none;
            padding: 11px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
            transition: all 0.3s;
        }
        .post-submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(46, 204, 113, 0.6); }

        /* DANH SÁCH BÀI VIẾT */
        .post-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .post-card {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 14px 16px;
            backdrop-filter: blur(6px);
            position: relative;
        }

        body.light-mode .post-card {
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .post-date {
            font-size: 10.5px;
            color: #4dabf7;
            font-weight: 700;
            margin-bottom: 4px;
        }
        body.light-mode .post-date { color: #0056b3; }

        .post-title {
            font-size: 14.5px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }
        body.light-mode .post-title { color: #111; }

        .post-content {
            font-size: 12px;
            color: #e0e0e0;
            line-height: 1.5;
            white-space: pre-wrap;
            margin-bottom: 10px;
        }
        body.light-mode .post-content { color: #333; }

        /* LƯỚI HIỂN THỊ ẢNH/VIDEO (2 TẤM 1 DÒNG) */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .media-item {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0,0,0,0.3);
        }

        .delete-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 0, 0, 0.25);
            color: #ffcccc;
            border: none;
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 10px;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }
        .delete-btn.show { display: inline-block; }
        .delete-btn:hover { background: rgba(255, 0, 0, 0.6); color: #fff; }

        .footer-nav {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.3s ease;
        }

        body.light-mode .back-btn { background: rgba(255, 255, 255, 0.5); color: #222; }
        .back-btn:hover { background: rgba(0, 123, 255, 0.4); border-color: #007bff; }

        .login-btn {
            background: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        body.light-mode .login-btn {
            background: rgba(255, 255, 255, 0.4);
            color: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .login-btn:hover {
            background: rgba(0, 123, 255, 0.4);
            color: #fff;
            border-color: #007bff;
        }
        .login-btn.logged-in {
            background: rgba(0, 123, 255, 0.5);
            color: #fff;
            border-color: #007bff;
        }
    </style>
</head>
<body class="light-mode">

    <!-- HỘP THOẠI NỔI ĐĂNG BÀI -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-photo-film" style="color: #2ecc71;"></i> Đăng bài viết mới</h3>
                <button class="modal-close-btn" onclick="toggleModal(false)"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <input type="text" id="postTitleInput" placeholder="Tiêu đề bài viết...">
            <textarea id="postContentInput" placeholder="Nhập nội dung chia sẻ..."></textarea>
            <input type="text" id="postMedia1" placeholder="🔗 Link ảnh / video 1 (URL)...">
            <input type="text" id="postMedia2" placeholder="🔗 Link ảnh / video 2 (URL)...">
            <button class="post-submit-btn" onclick="addNewPost()">Đăng ngay</button>
        </div>
    </div>

    <div class="container">
        <div class="header-posts">
            <div class="header-title-wrapper">
                <h2>📢 Tin tức</h2>
                <button class="add-post-toggle-btn" id="addToggleBtn" onclick="toggleModal(true)" title="Thêm bài viết mới"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div class="top-controls">
                <button class="control-btn" id="btn-theme" onclick="toggleTheme()" title="Đổi giao diện Sáng/Tối">🌙</button>
            </div>
        </div>

        <!-- DANH SÁCH BÀI VIẾT -->
        <div class="post-list" id="postListContainer">
            <!-- Bài viết tự động hiển thị -->
        </div>

        <div class="footer-nav">
            <a href="https://hoangztuank8-spec.github.io/personal-information/" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Trang chủ</a>
            <button class="login-btn" id="loginBtn" onclick="verifyAdmin()"><i class="fa-solid fa-lock"></i> Login</button>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "hoangzanh123"; 

        // Khởi tạo danh sách bài viết, luôn giữ lại bài cũ nếu có sẵn trong localStorage
        let savedPosts = localStorage.getItem('my_blog_posts');
        let posts = savedPosts ? JSON.parse(savedPosts) : [
            {
                id: 1,
                date: "📅 11/10/2026",
                title: "Chào mừng đến với trang tin tức của tôi!",
                content: "Đây là nơi mình đăng tải các thông báo và chia sẻ hành trình lập trình của một starter dev. Hãy theo dõi thường xuyên nhé! ^^",
                media: []
            }
        ];

        let isAdminLoggedIn = false;

        function renderPosts() {
            const container = document.getElementById('postListContainer');
            container.innerHTML = "";

            if (posts.length === 0) {
                container.innerHTML = `<div style="text-align:center; font-size:11px; color:#ccc; padding:20px;">Chưa có bài viết nào được đăng.</div>`;
                return;
            }

            posts.forEach((post) => {
                const card = document.createElement('div');
                card.className = 'post-card';
                
                let mediaHtml = '';
                if (post.media && post.media.length > 0) {
                    mediaHtml = '<div class="media-grid">';
                    post.media.forEach(url => {
                        if (url && url.trim() !== '') {
                            if (url.includes('.mp4') || url.includes('video')) {
                                mediaHtml += `<video src="${url.trim()}" class="media-item" controls></video>`;
                            } else {
                                mediaHtml += `<img src="${url.trim()}" class="media-item" alt="media">`;
                            }
                        }
                    });
                    mediaHtml += '</div>';
                }

                card.innerHTML = `
                    <button class="delete-btn ${isAdminLoggedIn ? 'show' : ''}" onclick="deletePost(${post.id})">Xóa</button>
                    <div class="post-date">${post.date}</div>
                    <div class="post-title">${post.title}</div>
                    <div class="post-content">${post.content}</div>
                    ${mediaHtml}
                `;
                container.appendChild(card);
            });
        }

        function verifyAdmin() {
            const loginBtn = document.getElementById('loginBtn');
            const addToggleBtn = document.getElementById('addToggleBtn');

            if (isAdminLoggedIn) {
                isAdminLoggedIn = false;
                addToggleBtn.classList.remove('show');
                toggleModal(false);
                loginBtn.innerHTML = `<i class="fa-solid fa-lock"></i> Login`;
                loginBtn.classList.remove('logged-in');
                renderPosts();
                alert("Đã đăng xuất khỏi chế độ quản trị!");
                return;
            }

            let pwd = prompt("Nhập mật khẩu quản trị viên:");
            if (pwd === ADMIN_PASSWORD) {
                isAdminLoggedIn = true;
                addToggleBtn.classList.add('show'); 
                loginBtn.innerHTML = `<i class="fa-solid fa-lock-open"></i> Logout`;
                loginBtn.classList.add('logged-in');
                renderPosts();
                alert("Đăng nhập thành công! Bấm vào dấu cộng (+) để viết bài kèm ảnh/video.");
            } else if (pwd !== null) {
                alert("Sai mật khẩu rồi bạn ơi!");
            }
        }

        function toggleModal(isOpen) {
            const modal = document.getElementById('modalOverlay');
            if (isOpen) {
                modal.classList.add('active');
            } else {
                modal.classList.remove('active');
            }
        }

        function addNewPost() {
            const title = document.getElementById('postTitleInput').value.trim();
            const content = document.getElementById('postContentInput').value.trim();
            const media1 = document.getElementById('postMedia1').value.trim();
            const media2 = document.getElementById('postMedia2').value.trim();

            if (!title || !content) {
                alert("Vui lòng nhập đầy đủ tiêu đề và nội dung!");
                return;
            }

            const now = new Date();
            const dateStr = `📅 ${String
